<!doctype html>
<html>
    <head>
        <title>Signup</title>
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <div class="header">
            <h1 class="logo">NEWS</h1>
            <a class="nav-link" href="news-display-grid.html">Signin</a>
            <a class="nav-link" href="news.signup.html">Signup</a>
        </div>



        <div class="signup-container">
            <h2 class="heading">Signin</h2>
        
            <form method="post" action="">
                
           
                <div class="form-element-container">
                        <div class="form-element">
                           <label for="name">Name:</label>
                           <input type="text" placeholder="Enter name" value="John" id="name" name="name">
                        </div>



                        <div class="form-element">
                          <label for="email">Email:</label>
                          <input type="text" placeholder="Enter email" value="john@xyz.com" id="email" name="email">
                        </div>

                        <div class="form-element">
                          <label for="password">Password:</label>
                          <input type="password" placeholder="Enter password" id="password" name="password">
                        </div>

                        <div class="form-element">
                             <label for="color">Favorite Color:</label>
                             <select id="color" name="color">
                                  <option>Red</option>
                                  <option selected>Green</option>
                                  <option>Blue</option>
                            </select>
                        </div>


                        <div class="form-element">
                            <label for="">Gender:</label>
                              <input type="radio" name="gender" id="male" value="M"> 
                              <label class="label-radio" for="male">Male</label>
                              <input type="radio" name="gender" id="female" value="F" checked>
                              <label class="label-radio" for="female">Female</label>
                        </div>


                        <div class="form-element">
                               <label for="student">I am a Student </label>
                               <input type="checkbox" id="student" name="student" value="Y" checked>
                        </div>


                </div>

                         
                        <div class="form-element">
                           <label for="about">About me: </label>
                           <textarea id="about" name="about">I want to become an astronaut</textarea>
                        </div>

                          
            
            
            </form>

                          <div class="submit-button">
                            <a href="news-display-grid.html" class="submit">Submit</a>
                          </div>
    
        </div>

        <footer>
            <div class="footer">
                <div class="footer-element">all Copy Right Reserved</div>
                <div class="footer-element">quary/Complains email @gamil.com</div>
            </div>
        </footer>
    </body>
</html>
